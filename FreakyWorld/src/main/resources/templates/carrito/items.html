<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/layout :: head('Items del carrito')}"></head>
    <body>
        <header th:replace="~{general/menu :: menu}"></header>

        <main>
            <section>
                <div class="encabezado-seccion">
                    <div>
                        <h1>Items del carrito</h1>
                        <p class="texto-suave">Consulta el detalle de los productos agregados.</p>
                    </div>
                </div>

                <div th:if="${items == null or #lists.isEmpty(items)}" class="sin-datos">
                    <p>No hay productos en el carrito.</p>
                </div>

                <div th:if="${items != null and !#lists.isEmpty(items)}" class="grid-productos">
                    <div class="tarjeta-producto" th:each="item : ${items}">
                        <div class="imagen-producto-contenedor">
                            <img th:if="${item.producto.rutaImagen != null}"
                                 th:src="${item.producto.rutaImagen}"
                                 alt="Imagen"
                                 class="imagen-producto">

                            <img th:if="${item.producto.rutaImagen == null}"
                                 src="https://via.placeholder.com/300x220?text=Sin+imagen"
                                 alt="Sin imagen"
                                 class="imagen-producto">
                        </div>

                        <div class="contenido-producto">
                            <h3 th:text="${item.producto.nombre}">Producto</h3>
                           
                                
                            
                            <p><strong>Precio:</strong> ₡<span th:text="${item.producto.precio}">0.00</span></p>
                            <p><strong>Cantidad:</strong> <span th:text="${item.cantidad}">1</span></p>
                            <p class="precio-producto">
                                Subtotal: ₡<span th:text="${item.producto.precio * item.cantidad}">0.00</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div th:if="${items != null and !#lists.isEmpty(items)}" class="resumen-carrito">
                    <div class="total-carrito">
                        <strong>Total:</strong>
                        <span>₡ <span th:text="${total}">0.00</span></span>
                    </div>
                </div>

                <a class="boton-volver" th:href="@{/carrito/listado}">Volver al carrito</a>
            </section>
        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>
    </body>
</html>
