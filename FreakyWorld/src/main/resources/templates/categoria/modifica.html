<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/layout :: head('Modificar categoría')}"></head>
    <body>
        <header th:replace="~{general/menu :: menu}"></header>

        <main>
            <section class="categoria-form-seccion">
                <div class="categoria-form-caja">
                    <h1>Modificar categoría</h1>
                    <p class="categoria-form-subtexto">Actualiza la información de la categoría.</p>

                    <!-- AQUI AGREGUE enctype PARA ENVIAR IMAGEN -->
                    <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post" enctype="multipart/form-data" class="categoria-formulario">
                        <input type="hidden" th:field="*{idCategoria}">

                        <div>
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" required>
                        </div>

                        <div>
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>
                        </div>

                        <!-- AQUI MUESTRO LA IMAGEN ACTUAL SI EXISTE -->
                        <div th:if="${categoria.rutaImagen != null and !#strings.isEmpty(categoria.rutaImagen)}">
                            <label>Imagen actual</label><br>
                            <img th:src="${categoria.rutaImagen}" alt="Imagen de categoría" style="max-width: 200px; border-radius: 8px; margin-top: 8px;">
                        </div>

                        <!-- AQUI AGREGUE EL CAMPO PARA CAMBIAR LA IMAGEN -->
                        <div>
                            <label for="imagen">Nueva imagen</label>
                            <input type="file" id="imagen" name="imagen" accept="image/*">
                        </div>

                        <div class="categoria-form-botones">
                            <button type="submit">Guardar cambios</button>
                            <a class="boton-volver" th:href="@{/categoria/listado}">Volver a categorías</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>
    </body>
</html>
