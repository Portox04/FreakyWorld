<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/layout :: head('Iniciar sesión')}"></head>
    <body>
        <header th:replace="~{general/menu :: menu}"></header>

        <main>
            <section>
                <h1>Iniciar sesión</h1>

                <div th:if="${param.error}">
                    <p>Correo o contraseña incorrectos.</p>
                </div>

                <div th:if="${param.logout}">
                    <p>Sesión cerrada correctamente.</p>
                </div>

                <form th:action="@{/login}" method="post">
                    <div>
                        <label for="username">Correo</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div>
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div>
                        <button type="submit">Ingresar</button>
                    </div>
                </form>

                <div>
                    <p>¿No tienes cuenta? <a th:href="@{/registro/nuevo}">Regístrate aquí</a></p>
                </div>
            </section>
        </main>

        <footer th:replace="~{general/footer :: footer}"></footer>
    </body>
</html>
